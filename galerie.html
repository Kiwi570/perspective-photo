<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0B0B0C"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..700&family=Onest:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/pp.css"><script src="/pp.js" defer></script>
<title>Galerie — Perspective Photo, éditions limitées de Joël Gourlain</title>
<meta name="description" content="Quatorze photographies en édition limitée de trente exemplaires : concerts, New York, Le Havre la nuit, Caraïbes, Cyclades, street art. Visitez le mur, ou parcourez la grille.">
<meta property="og:title" content="La galerie — Perspective Photo"><meta property="og:image" content="https://perspective-photo-final.vercel.app/media/havre-nuit.jpg">
</head>
<body data-solid="1">
<main id="main">
<section class="wrap" style="padding-top:120px">
  <span class="eyebrow">La galerie</span>
  <h1 class="h1">Toutes les éditions.</h1>
  <p class="lead" style="margin-top:16px">Quatorze photographies, trente exemplaires chacune. Sur le mur, la lumière suit votre passage ; en grille, tout est là d'un coup d'œil.</p>
  <div class="gtop" style="margin-top:32px">
    <div class="filters" id="filters"></div>
    <div class="seg" id="mode"><button type="button" data-m="walk" aria-pressed="false">Visite</button><button type="button" data-m="grid" aria-pressed="false">Grille</button></div>
  </div>
</section>
<section id="gal">
  <div class="walk" id="walk">
    <div class="walk__spot" id="wspot"></div>
    <div class="walk__track" id="track"></div>
    <div class="walk__hint" id="whint">Faites défiler, molette ou glisser. Les œuvres s'éclairent à votre passage.</div>
    <div class="walk__ctl"><button type="button" id="wprev" aria-label="Reculer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button><button type="button" id="wnext" aria-label="Avancer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
  </div>
  <div class="wrap"><div class="grid" id="grid"></div><p class="mono" id="gcount" style="margin-top:18px"></p></div>
</section>
</main>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const q = new URLSearchParams(location.search); let group = q.get('u') || 'all';
  const filters = document.getElementById('filters'), grid = document.getElementById('grid'), track = document.getElementById('track'), gal = document.getElementById('gal');
  filters.innerHTML = PP.GROUPS.map(g => '<button class="chip" type="button" data-g="' + g[0] + '" aria-pressed="' + (g[0] === group) + '">' + g[1] + '</button>').join('');
  const heart = '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';
  grid.innerHTML = PP.W.map(w => '<article class="card" data-id="' + w.id + '"><a class="im ' + w.o + '" href="/oeuvre?id=' + w.id + '" data-cursor="Voir l\'œuvre">' + PP.img(w) + (w.isNew ? '<span class="new">Nouveauté</span>' : '') + '</a><button class="fav' + (PP.state.fav.has(w.id) ? ' is-on' : '') + '" data-fav="' + w.id + '" aria-label="Ajouter aux favoris">' + heart + '</button><div class="cap"><a href="/oeuvre?id=' + w.id + '"><b>' + w.t + '</b></a><span>' + PP.uname(w.u) + ' · dès ' + PP.eur(PP.FORMATS[0].p) + '</span></div></article>').join('');
  track.innerHTML = PP.W.map(w => '<a class="wk ' + w.o + '" href="/oeuvre?id=' + w.id + '" data-id="' + w.id + '" data-cursor="Voir l\'œuvre">' + PP.img(w) + '<span class="lbl">' + w.t + '<small>' + PP.uname(w.u) + ' · édition de 30</small></span></a>').join('');
  const apply = () => { let n = 0; document.querySelectorAll('.card, .wk').forEach(el => { const ok = PP.inGroup(PP.byId(el.dataset.id), group); el.classList.toggle('hide', !ok); el.style.display = ok ? '' : 'none'; if (ok && el.classList.contains('card')) n++; }); document.getElementById('gcount').textContent = n + (n > 1 ? ' œuvres' : ' œuvre') + ', trente exemplaires chacune'; document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.g === group)); };
  filters.addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; group = b.dataset.g; apply(); history.replaceState(null, '', group === 'all' ? '/galerie' : '/galerie?u=' + group); });
  grid.addEventListener('click', e => { const b = e.target.closest('[data-fav]'); if (!b) return; const on = PP.toggleFav(b.dataset.fav); b.classList.toggle('is-on', on); PP.toast(on ? 'Ajouté à vos favoris' : 'Retiré de vos favoris'); });
  apply();
  // mode : visite sur desktop, grille sur mobile
  const setMode = m => { gal.className = 'gmode-' + m; document.querySelectorAll('#mode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m)); sessionStorage.setItem('pp-mode', m); };
  document.getElementById('mode').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.m); });
  setMode(sessionStorage.getItem('pp-mode') || (PP.fine && innerWidth > 900 ? 'walk' : 'grid'));
  // visite : défilement horizontal à la molette, au glisser, aux flèches ; lumière qui suit
  const walk = document.getElementById('walk'), spot = document.getElementById('wspot'); let x = 0, tx = 0, max = 0, down = false, sx = 0, sxx = 0, moved = false;
  const measure = () => { max = Math.max(0, track.scrollWidth - walk.clientWidth); }; addEventListener('resize', measure); setTimeout(measure, 300); setTimeout(measure, 1500);
  const clamp = v => Math.max(-max, Math.min(0, v));
  walk.addEventListener('wheel', e => { if (gal.className !== 'gmode-walk') return; e.preventDefault(); measure(); tx = clamp(tx - (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * 1.2); }, {passive:false});
  walk.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; down = true; moved = false; sx = e.clientX; sxx = tx; });
  walk.addEventListener('pointermove', e => { if (PP.fine) { const r = walk.getBoundingClientRect(); spot.style.setProperty('--x', ((e.clientX - r.left) / r.width * 100) + '%'); spot.style.setProperty('--y', ((e.clientY - r.top) / r.height * 100) + '%'); } if (!down) return; const d = e.clientX - sx; if (Math.abs(d) > 4) moved = true; measure(); tx = clamp(sxx + d); });
  const up = () => { down = false; }; walk.addEventListener('pointerup', up); walk.addEventListener('pointercancel', up); walk.addEventListener('pointerleave', up);
  track.addEventListener('click', e => { if (moved) e.preventDefault(); });
  document.getElementById('wnext').onclick = () => { measure(); tx = clamp(tx - walk.clientWidth * .6); }; document.getElementById('wprev').onclick = () => { measure(); tx = clamp(tx + walk.clientWidth * .6); };
  addEventListener('keydown', e => { if (gal.className !== 'gmode-walk') return; if (e.key === 'ArrowRight') document.getElementById('wnext').click(); if (e.key === 'ArrowLeft') document.getElementById('wprev').click(); });
  (function loop(){ x += (tx - x) * (PP.reduced ? 1 : .09); track.style.transform = 'translate3d(' + x + 'px,0,0)'; if (PP.fine) { const r = walk.getBoundingClientRect(), cx = parseFloat(spot.style.getPropertyValue('--x') || '50') / 100 * r.width; document.querySelectorAll('.wk').forEach(w => { const b = w.getBoundingClientRect(); const d = Math.abs(b.left + b.width / 2 - r.left - cx); w.style.filter = 'brightness(' + Math.max(.55, 1.05 - d / 900) + ')'; }); } requestAnimationFrame(loop); })();
  if (!PP.fine) document.getElementById('whint').textContent = 'Glissez pour longer le mur';
});
</script>
</body>
</html>
